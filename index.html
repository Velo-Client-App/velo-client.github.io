<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 35px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.2);
        }
        .btn:hover {
            background-color: #2ea043;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .links {
            margin-top: 30px;
        }
        .links a {
            color: #58a6ff;
            text-decoration: none;
            margin: 0 12px;
            font-size: 0.95rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Velo Client</h1>
        <p>An alternative launcher packed with additional features.</p>
        
        <!-- The Download Button -->
        <a href="https://github.com/Velo-Client/Velo-Client/releases" id="download-btn" class="btn">Download Latest Version</a>
        
        <div class="links">
            <a href="https://github.com/Velo-Client/Velo-Client" target="_blank">GitHub Repository</a>
            <a href="https://discord.gg" target="_blank">Discord Server</a>
        </div>
    </div>

    <script>
        // Directly targeted to your repository releases
        const org = "Velo-Client"; 
        const repo = "Velo-Client"; 

        async function fetchLatestReleaseFile() {
            try {
                const response = await fetch(`https://github.com{org}/${repo}/releases/latest`);
                if (!response.ok) throw new Error('Network issue');
                
                const data = await response.json();
                
                // Inspects your release and grabs the first installer/file asset compiled (.exe, .zip, etc.)
                if (data.assets && data.assets.length > 0) {
                    document.getElementById('download-btn').href = data.assets[0].browser_download_url;
                } else {
                    // Fallback to the overall release page if no compiled files are attached yet
                    document.getElementById('download-btn').href = data.html_url;
                }
            } catch (error) {
                console.error("Could not fetch automated link:", error);
                // Hardcoded baseline fallback
                document.getElementById('download-btn').href = `https://github.com{org}/${repo}/releases/latest`;
            }
        }

        fetchLatestReleaseFile();
    </script>

</body>
</html>
