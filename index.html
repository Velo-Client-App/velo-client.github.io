<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Client</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --border: #1a1a1a;
            --text: #f5f5f5;
            --dim: #8a8a8a;
            --mute: #5a5a5a;
            --accent: #6366f1;
            --accent-hover: #7c7ff2;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 22px;
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--dim);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--dim);
            font-weight: 500;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: #ffffff;
            padding: 15px 32px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.15s, transform 0.1s;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .version-note {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--mute);
        }

        .links {
            margin-top: 40px;
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.15s;
        }

        .links a:hover {
            color: var(--text);
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .logo { width: 68px; height: 68px; }
            .btn { padding: 13px 24px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="logo" src="logo.png" alt="Velo Client">
        <h1>Velo Client</h1>
        <p class="tagline">A cleaner Roblox launcher with the extras built in.</p>

        <div class="badges">
            <span class="badge"><span class="badge-dot"></span>Windows 10 and 11</span>
            <span class="badge" id="version-badge">Checking latest version</span>
        </div>

        <a href="https://github.com/Velo-Client/Velo-Client/releases/latest" id="download-btn" class="btn" disabled>Loading latest release</a>

        <div class="version-note" id="version-note"></div>

        <div class="links">
            <a href="https://github.com/Velo-Client/Velo-Client" target="_blank" rel="noopener">GitHub</a>
            <a href="https://github.com/Velo-Client/Velo-Client/releases" target="_blank" rel="noopener">All Releases</a>
        </div>
    </div>

    <script>
        const ORG = "Velo-Client";
        const REPO = "Velo-Client";
        const VERSION_JSON = `https://raw.githubusercontent.com/${ORG}/${REPO}/refs/heads/main/version.json`;
        const RELEASES_LATEST = `https://github.com/${ORG}/${REPO}/releases/latest`;
        const DOWNLOAD_TEMPLATE = (tag) => `https://github.com/${ORG}/${REPO}/releases/download/${tag}/Velo.Client.exe`;

        const btn = document.getElementById("download-btn");
        const badge = document.getElementById("version-badge");
        const note = document.getElementById("version-note");

        async function loadLatest() {
            try {
                const res = await fetch(`${VERSION_JSON}?t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const tag = data && data.version ? String(data.version).trim() : null;
                if (!tag) throw new Error("No version field");

                badge.textContent = `Latest: ${tag}`;
                btn.textContent = `Download ${tag}`;
                btn.href = DOWNLOAD_TEMPLATE(tag);
                btn.disabled = false;

                if (data.updated) {
                    note.textContent = `Last updated ${data.updated}`;
                }
            } catch (e) {
                badge.textContent = "Latest version";
                btn.textContent = "Download Latest Version";
                btn.href = RELEASES_LATEST;
                btn.disabled = false;
                note.textContent = "";
            }
        }

        loadLatest();
    </script>

</body>
</html>
