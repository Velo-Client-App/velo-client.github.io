<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Client</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --border: #1a1a1a;
            --border-2: #262626;
            --text: #f5f5f5;
            --dim: #8a8a8a;
            --mute: #5a5a5a;
            --accent: #6366f1;
            --accent-hover: #7c7ff2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(60% 45% at 50% 30%, rgba(99, 102, 241, 0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 24px rgba(99, 102, 241, 0.35));
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--dim);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--dim);
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: #ffffff;
            padding: 15px 34px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.22), 0 1px 0 rgba(255, 255, 255, 0.08) inset;
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35), 0 1px 0 rgba(255, 255, 255, 0.10) inset;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.is-loading {
            background: var(--panel);
            color: var(--mute);
            border-color: var(--border);
            box-shadow: none;
            pointer-events: none;
        }

        .version-note {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--mute);
            min-height: 20px;
        }

        .features {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 40px;
        }

        .feature {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--dim);
        }

        .feature svg {
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .links {
            margin-top: 32px;
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.15s;
        }

        .links a:hover {
            color: var(--text);
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .logo { width: 68px; height: 68px; }
            .btn { padding: 13px 26px; font-size: 0.95rem; }
            .feature { font-size: 0.8rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="logo" src="logo.png" alt="Velo Client">
        <h1>Velo Client</h1>
        <p class="tagline">A cleaner Roblox launcher with the extras built in.</p>

        <div class="badges">
            <span class="badge">Windows 10 and 11</span>
            <span class="badge" id="version-badge">Checking version</span>
        </div>

        <a href="https://github.com/Velo-Client/Velo-Client/releases/latest" id="download-btn" class="btn is-loading">Loading latest release</a>

        <div class="version-note" id="version-note"></div>

        <div class="features">
            <span class="feature">
                <svg viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Fast launching
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                FastFlags editor
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Themes and mods
            </span>
        </div>

        <div class="links">
            <a href="https://github.com/Velo-Client/Velo-Client" target="_blank" rel="noopener">GitHub</a>
            <a href="https://github.com/Velo-Client/Velo-Client/releases" target="_blank" rel="noopener">All Releases</a>
        </div>
    </div>

    <script>
        const ORG = "Velo-Client";
        const REPO = "Velo-Client";
        const VERSION_JSON = `https://raw.githubusercontent.com/${ORG}/${REPO}/refs/heads/main/version.json`;
        const RELEASES_LATEST = `https://github.com/${ORG}/${REPO}/releases/latest`;
        const DOWNLOAD_TEMPLATE = (tag) => `https://github.com/${ORG}/${REPO}/releases/download/${tag}/Velo.Client.exe`;

        const btn = document.getElementById("download-btn");
        const badge = document.getElementById("version-badge");
        const note = document.getElementById("version-note");

        async function loadLatest() {
            try {
                const res = await fetch(`${VERSION_JSON}?t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const tag = data && data.version ? String(data.version).trim() : null;
                if (!tag) throw new Error("No version field");

                badge.textContent = `Latest: ${tag}`;
                btn.textContent = `Download ${tag}`;
                btn.href = DOWNLOAD_TEMPLATE(tag);
                btn.classList.remove("is-loading");

                if (data.updated) {
                    note.textContent = `Last updated ${data.updated}`;
                }
            } catch (e) {
                badge.textContent = "Latest version";
                btn.textContent = "Download Latest Version";
                btn.href = RELEASES_LATEST;
                btn.classList.remove("is-loading");
                note.textContent = "";
            }
        }

        loadLatest();
    </script>

</body>
</html>
