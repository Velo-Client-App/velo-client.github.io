<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Client</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --border: #1a1a1a;
            --border-2: #262626;
            --text: #f5f5f5;
            --dim: #9a9a9a;
            --mute: #5a5a5a;
            --accent: #6366f1;
            --accent-hover: #7c7ff2;
            --accent-soft: rgba(99, 102, 241, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(60% 45% at 50% 25%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 26px rgba(99, 102, 241, 0.4));
        }

        h1 {
            color: #ffffff;
            font-size: 2.6rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--dim);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--panel);
            border: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--dim);
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: #ffffff;
            padding: 15px 34px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.20);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.is-loading {
            background: var(--panel);
            color: var(--mute);
            border-color: var(--border);
            box-shadow: none;
            pointer-events: none;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.06);
            border: 1px solid rgba(34, 197, 94, 0.16);
            font-size: 0.8rem;
            color: #86efac;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .features {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 42px;
        }

        .feature {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--dim);
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.12s ease;
        }

        .feature:hover {
            border-color: var(--border-2);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            transform: translateY(-1px);
        }

        .feature svg {
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .whats-new {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--mute);
            max-width: 420px;
            line-height: 1.5;
            min-height: 20px;
        }

        .links {
            margin-top: 36px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.12s ease;
        }

        .links a:hover {
            border-color: var(--border-2);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            transform: translateY(-1px);
        }

        .links a svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .logo { width: 68px; height: 68px; }
            .btn { padding: 13px 26px; font-size: 0.95rem; }
            .feature { font-size: 0.8rem; padding: 6px 12px; }
            .links a { font-size: 0.8rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="logo" src="logo.png" alt="Velo Client">
        <h1>Velo Client</h1>
        <p class="tagline">A cleaner Roblox launcher with the extras built in.</p>

        <div class="badges">
            <span class="badge">Windows 10 and 11</span>
            <span class="badge" id="version-badge">Checking version</span>
        </div>

        <a href="https://github.com/Velo-Client/Velo-Client/releases/latest" id="download-btn" class="btn is-loading">Loading latest release</a>

        <div class="status-line" id="status-line" style="display:none;">
            <span class="status-dot"></span>
            <span id="status-text">Ready to download</span>
        </div>

        <div class="features">
            <span class="feature">
                <svg viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Fast launching
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                FastFlags editor
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Themes and mods
            </span>
        </div>

        <div class="whats-new" id="whats-new"></div>

        <div class="links">
            <a href="https://github.com/Velo-Client/Velo-Client" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                GitHub
            </a>
            <a href="https://github.com/Velo-Client/Velo-Client/releases" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                All Releases
            </a>
        </div>
    </div>

    <script>
        const ORG = "Velo-Client";
        const REPO = "Velo-Client";
        const VERSION_JSON = `https://raw.githubusercontent.com/${ORG}/${REPO}/refs/heads/main/version.json`;
        const RELEASES_LATEST = `https://github.com/${ORG}/${REPO}/releases/latest`;
        const DOWNLOAD_TEMPLATE = (tag) => `https://github.com/${ORG}/${REPO}/releases/download/${tag}/Velo.Client.exe`;

        const btn = document.getElementById("download-btn");
        const badge = document.getElementById("version-badge");
        const statusLine = document.getElementById("status-line");
        const statusText = document.getElementById("status-text");
        const whatsNew = document.getElementById("whats-new");

        function showStatus(text) {
            statusText.textContent = text;
            statusLine.style.display = "inline-flex";
        }

        async function loadLatest() {
            try {
                const res = await fetch(`${VERSION_JSON}?t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const tag = data && data.version ? String(data.version).trim() : null;
                if (!tag) throw new Error("No version field");

                badge.textContent = `Latest: ${tag}`;
                btn.textContent = `Download ${tag}`;
                btn.href = DOWNLOAD_TEMPLATE(tag);
                btn.classList.remove("is-loading");

                showStatus("Ready to download");

                if (data.notes) {
                    whatsNew.textContent = data.notes;
                } else if (data.updated) {
                    whatsNew.textContent = `Updated ${data.updated}`;
                }
            } catch (e) {
                badge.textContent = "Latest version";
                btn.textContent = "Download Latest Version";
                btn.href = RELEASES_LATEST;
                btn.classList.remove("is-loading");
                showStatus("Could not load version info");
            }
        }

        loadLatest();
    </script>

</body>
</html>
